name: Official Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version to build (default: v0.1.9)'
        required: false
        default: 'v0.1.9'

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Release Preflight & Version Consistency Checks
  # ----------------------------------------------------------------------------
  preflight:
    name: Preflight & Version Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Resolve Target Version & Tag
        id: vars
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Version Consistency
        run: |
          node scripts/verify-version.mjs --tag "${{ steps.vars.outputs.tag }}"

      - name: Verify Tag Ancestry on Main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main:main
          if ! git merge-base --is-ancestor HEAD main; then
            echo "❌ Error: Tag commit is not reachable from protected main branch!"
            exit 1
          fi
          echo "✅ Tag commit is an ancestor of main."

  # ----------------------------------------------------------------------------
  # Job 2: Multi-Platform Build Matrix (macOS, Windows, Linux)
  # ----------------------------------------------------------------------------
  build-matrix:
    name: Build (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04

    steps:
      - name: Checkout Source at Exact Tag Commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Webview Bundle
        run: npm run build

      - name: Run Hermetic Unit Tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Desktop Application Package
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            npm run tauri -- build --bundles app
          else
            npm run tauri -- build
          fi

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          if [ "${{ matrix.platform }}" = "macos" ]; then
            APP=$(find src-tauri/target -path "*/bundle/*" -name "*.app" -type d 2>/dev/null | head -n 1 || true)
            if [ -n "$APP" ]; then
              echo "Packaging DMG from app bundle ($APP)..."
              STAGE_DIR="src-tauri/target/stage_dmg"
              rm -rf "$STAGE_DIR"
              mkdir -p "$STAGE_DIR"
              cp -r "$APP" "$STAGE_DIR/"
              ln -s /Applications "$STAGE_DIR/Applications"
              TAG="${{ github.ref_name }}"
              ARCH=$(uname -m)
              DMG_NAME="QvReader_${TAG#v}_${ARCH}.dmg"
              hdiutil create -volname "QvReader" -srcfolder "$STAGE_DIR" -ov -format UDZO "dist-artifacts/$DMG_NAME"
              rm -rf "$STAGE_DIR"
            fi
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            find src-tauri/target -path "*/bundle/*" -name "*.exe" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
            find src-tauri/target -path "*/bundle/*" -name "*.msi" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            find src-tauri/target -path "*/bundle/*" -name "*.AppImage" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
            find src-tauri/target -path "*/bundle/*" -name "*.deb" -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          fi
          ls -la dist-artifacts/

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Job 3: Publish GitHub Release
  # ----------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    if: github.repository == 'qvcloud/QvReader' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist-release

      - name: Inspect Release Artifacts
        run: |
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: dist-release/*
          tag_name: ${{ github.ref_name }}
          name: QvReader ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          prerelease: false
