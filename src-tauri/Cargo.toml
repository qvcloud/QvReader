[package]
name = "qvreader"
version = "0.1.8"
description = "Ultra-lightweight Instant Markdown Reader & Editor"
authors = ["QvReader Team"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/qvcloud/QvReader"
homepage = "https://qvreader.com"
default-run = "QvReader"

[[bin]]
name = "QvReader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
cc = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
notify = "6.1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
dirs = "6.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
keyring = "2.1"

[features]
default = ["custom-protocol", "pro"]
custom-protocol = ["tauri/custom-protocol"]
pro = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"
