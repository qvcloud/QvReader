<!-- Concept: White background with Two-Line Qv Reader (Line 1: Qv, Line 2: Reader in smaller font) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="mac-shadow" x="-10%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.16" />
    </filter>
    <linearGradient id="qvGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  <rect x="100" y="96" width="824" height="824" rx="185" fill="#ffffff" filter="url(#mac-shadow)" />
  <rect x="100.5" y="96.5" width="823" height="823" rx="184.5" fill="none" stroke="url(#innerBorder)" stroke-width="1" />
  <text x="512" y="518" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Helvetica Neue', Arial, sans-serif" font-size="300" font-weight="800" fill="url(#qvGrad)" text-anchor="middle" letter-spacing="-6">Qv</text>
  <text x="512" y="705" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Helvetica Neue', Arial, sans-serif" font-size="135" font-weight="700" fill="url(#qvGrad)" text-anchor="middle" letter-spacing="2">Reader</text>
</svg>

